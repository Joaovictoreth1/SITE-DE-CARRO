map $status:$uri $motornews_cache {
    ~^(200|206|304):/assets/ "public, max-age=31536000, immutable";
    default "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; object-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' https://images.unsplash.com; media-src https://s3.amazonaws.com/webflow-prod-assets/689c67bcc7193a0725e2aecf/; connect-src https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control $motornews_cache always;

    location / {
        try_files $uri $uri/ =404;
        limit_except GET { deny all; }
    }
}
